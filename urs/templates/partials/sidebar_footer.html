<div class="p-3 border-t border-gray-100 space-y-3">
    <div class="flex items-center justify-between px-3 py-2 bg-gray-50 rounded-xl">
        <div class="flex items-center gap-2 text-xs font-semibold text-gray-600">
            <i class="theme-toggle-icon fa-regular fa-sun text-amber-500"></i>
            <span class="theme-toggle-label">الوضع الفاتح</span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" value="" class="sr-only peer theme-toggle-input" onchange="toggleTheme(this)">
            <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
        </label>
    </div>

    <div class="bg-gradient-to-br from-indigo-900 to-indigo-800 text-white p-4 rounded-2xl relative overflow-hidden shadow-sm">
        <div class="flex items-start justify-between mb-2">
            <h4 class="text-sm font-bold">هل تحتاج مساعدة؟</h4>
            <span class="w-7 h-7 bg-indigo-700/60 rounded-full flex items-center justify-center text-xs">
                <i class="fa-solid fa-headset"></i>
            </span>
        </div>
        <p class="text-[11px] text-indigo-200 mb-3 leading-relaxed">استكشف مركز المساعدة أو تواصل مع الدعم الفني.</p>
        <button onclick="openModal('supportModal')" class="w-full bg-indigo-600 hover:bg-indigo-500 transition text-white text-xs font-semibold py-2 rounded-xl shadow">تواصل الآن</button>
    </div>
    <div class="px-3 text-center text-[10px] text-gray-400 font-mono" dir="ltr">v{{ deploy_version|default:"dev" }}</div>
</div>
